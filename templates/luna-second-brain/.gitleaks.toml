# gitleaks config for the luna second-brain vault.
# Keeps the full built-in ruleset and only adds a path allowlist for the
# vendored third-party Obsidian plugin bundles shipped under .obsidian/plugins/
# (and, since HIMMEL-3066, the opt-in github-sync plugin's generated assets
# under optional/plugins/github-sync/ instead). Those bundles are minified
# upstream code; gitleaks' generic-api-key rule flags high-entropy minified
# identifiers (e.g. node-forge's pki.setRsaPrivateKey in
# obsidian-local-rest-api) as false-positive "secrets". The pre-commit
# `exclude:` does NOT reach gitleaks (the hook scans the staged diff
# directly), so the allowlist has to live here. The github-sync allowlist
# entry is scoped to ONLY its generated main.js/styles.css — its data.json is
# tracked (not gitignored, unlike obsidian-local-rest-api's) and must stay
# scanned.
[extend]
useDefault = true

[allowlist]
description = "Vendored plugin bundles + known-benign local loopback proxy token"
paths = [
  '''\.obsidian/plugins/''',
  '''optional/plugins/github-sync/(main\.js|styles\.css)$''',
]
# The end-session-wiki hook captures session bash verbatim, so probes against
# the local CLIProxyAPI gateway (127.0.0.1:8317) land in sessions/*.md as
# `curl -H "Authorization: Bearer himmel-local-claudex"`. That token is a
# documented, loopback-only, shared constant checked into himmel itself
# (scripts/setup/cli-proxy-lane.ps1), not a credential. Suppress the generic
# curl-auth-header false positive for this one literal only. Anchored (^…$)
# so it suppresses ONLY the exact constant — a prefixed/suffixed bearer
# credential (himmel-local-claudex-<real-secret>) is still caught.
# queue-lock release tokens (himmel scripts/handover/queue-lock.sh) are written
# into each leg's LIVE bullet on purpose (HIMMEL-2813 workaround: autocompact
# loses them otherwise). Their default shape is <host>-<arch>-pid<N>, e.g.
# `cachyos-x8664-pid199036` — a process id, not a credential — but the
# generic-api-key rule flags the line ("release-token: `...`") on entropy, and
# that refusal silently stalls the github-sync autosync commit (2026-09-09,
# console 03F: staged for 40 min, three missed syncs) — github-sync is opt-in
# since HIMMEL-3066, but this allowlist keeps working unchanged for any vault
# that has it enabled. Anchored to that exact
# shape, plus one optional trailing sentence-punctuation character (HIMMEL-2910:
# a leg's bare, unbacktick-quoted `release-token=<token>.` let gitleaks capture
# the trailing "." into the secret, missing the anchor) — a suffixed real
# credential is still caught, only that shape.
# RETASK-channel nonces (docs/internals/retask-channel.md), shape
# `<console letter(s)>-N<leg>-<hex>` e.g. `Y-N204-a68d71`, are written into
# leg briefs/handovers on purpose and land in session notes the same way the
# queue-lock token above does (HIMMEL-3003: a nonce stalled the vault's
# autosync commit on 2026-09-13; HIMMEL-3168: nonces are now 16 hex, e.g.
# `B-N44-b5c0792bbc9bdc03`, so the hex run is bounded {4,16}). Anchored to that exact shape, plus one
# optional trailing sentence-punctuation character — a suffixed real
# credential is still caught, only that shape.
# HIMMEL-3471: a fresh-leg recovery mints a RETASK nonce with a single
# trailing lowercase letter on the leg number (e.g. `V-N236b-1d281f74`,
# chained recoveries go b, c, d, ...; verified against the live handover
# corpus — that suffix is always exactly one letter, never doubled), which
# the pre-3471 regex didn't anchor for and stalled every vault commit that
# quoted such a doc. The ticket also asked for a `paths` entry scoping this
# allowlist to the handover bucket; empirically verified (3 isolated gitleaks
# runs against this build, including a negative control pairing a real `paths`
# match with a regex that can never match) that this build's `[[allowlists]]`
# `matchCondition = "AND"` does not actually AND paths+regexes — a path match
# alone suppresses the finding — so a `paths`-scoped entry here would be a
# broader, unscoped exemption for anything under that path, not a narrower
# one. Widening only the anchored regex below keeps the exemption as tight as
# the token shape itself, regardless of which file it appears in.
regexes = [
  '''^himmel-local-claudex$''',
  '''^[a-z0-9]+-[a-z0-9]+-pid[0-9]+[.,;:)]?$''',
  '''^[A-Z]{1,2}-N[0-9]+[a-z]?-[0-9a-f]{4,16}[.,;:)]?$''',
]
