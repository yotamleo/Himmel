# HIMMEL-924 — alert rule definitions, Prometheus-native rule-file format.
#
# This file is the SOURCE OF TRUTH for every rule's PromQL expression: it is
# loaded by the live Prometheus (see prometheus.yml's rule_files) so the
# rules are visible + self-testable via `promtool test rules` even though no
# Alertmanager is installed in this stack (Prometheus evaluates and exposes
# them at /rules and /alerts, but delivers nothing — no receiver is
# configured, so there is no double-delivery risk).
#
# Telegram DELIVERY is exclusively Grafana's unified alerting, ratified F3 —
# see provisioning/alerting/rules.yaml, which re-implements each rule below
# as a Grafana-managed rule against the same PromQL expression string (kept
# byte-identical by convention; Grafana's provisioning YAML dialect cannot
# `expr:`-reference this file directly). If you change an expression here,
# change it there too — grep both files for the rule name.
#
# Metric provenance: scripts/observability/flow-exporter.ts (README.md
# documents every family), except the windows_memory_* families, which come
# straight from windows_exporter's built-in `memory` collector. Coverage table
# + design rationale: scripts/observability/README.md#alerting-himmel-924.
groups:
  - name: himmel-observability
    rules:
      # HIMMEL-918 failure mode: the 600s background-wait ceiling truncating
      # a run mid-batch. Fires within one evaluation cycle of the end row
      # landing (short window, no `for` grace — a truncated run is already a
      # completed, terminal fact by the time it's observed).
      - alert: HimmelFlowRunTruncated
        expr: increase(flow_run_outcome_total{outcome="truncated"}[15m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: 'Flow {{ $labels.flow }} run truncated in the last 15m'

      # HIMMEL-918 failure mode: transient CLI/API death reporting a nonzero
      # exit.
      - alert: HimmelFlowRunError
        expr: increase(flow_run_outcome_total{outcome="error"}[15m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: 'Flow {{ $labels.flow }} run errored in the last 15m'

      # HIMMEL-918 failure mode: permission-prompt stall / SIGKILL with no
      # exit code — a start row with no matching end row past the flow's
      # stall deadline. armed-resume stalls are semi-expected operator behavior
      # and are excluded here — they remain dashboard-only. That exclusion IS
      # the alert-fatigue fix (it is what stops the 11 standing armed-resume
      # stalls paging every 4h).
      #
      # Deliberately silent: successful runs, in_flight runs within deadline,
      # small luna_inbox_backlog oscillations (the 3-day-rise rule is the
      # backstop), and ambiguous orphan classes. HimmelSessionDead DID prove
      # noisy (HIMMEL-2149: SessionEnd hook cancellation, see its own comment
      # below) and moved to warn; the flat 4h Telegram route intentionally
      # has no severity routing.
      # HIMMEL-1695: this stays a LEVEL check, NOT increase(). The alert-fatigue
      # fix is the `flow!="armed-resume"` exclusion above — that alone stops the
      # 11 standing armed-resume stalls from paging. Switching to increase() is a
      # SEPARABLE change and is unsound here: flow_run_outcome_total is declared
      # a counter but is rebuilt from a sliding 14d ledger window
      # (flow-exporter.ts:305-339), so its value DECREASES when rows age out or
      # the exporter restarts. Prometheus reads that decrease as a counter reset,
      # which can page with no new stall AND can hide a new stall when an
      # expiration offsets the increment. Same reasoning HimmelSessionDead states
      # below for its own gauge: a terminal fact observed after the fact is a
      # level, not a rate. Revisit only once HIMMEL-1695 lands a durable
      # monotonic stall-event counter — and do not substitute delta() without
      # testing simultaneous expiration and new-stall cases.
      #
      # HIMMEL-2211: this alert sent 53 Telegram pages in one night for ZERO
      # real incidents, from two compounding defects, both now fixed:
      #   1. The exporter's fold could not tell a real stall from a ghost row.
      #      An unpaired start whose pid is confirmed dead on its own host is
      #      now exported as `abandoned`, not `stalled` — flow-exporter.ts's
      #      foldFlowLedger liveness split keeps dead-pid ghost rows (the
      #      triggering row: hermes-invoke-1787956038-3242214, pid 3242214,
      #      dead) out of this expr entirely.
      #   2. The exporter's render (~6.6s avg / ~9.9s peak) was blowing
      #      Prometheus's default 10s scrape_timeout 51 times/day
      #      (prometheus.yml). A scrape timeout marks the target DOWN, which
      #      stales EVERY series it exports — this alert resolves, then
      #      re-fires on the next good scrape. That flap, not a real stall,
      #      produced the 53 pages.
      # `for: 10m` and `keep_firing_for: 30m` are safe ONLY now that (2) is
      # fixed — `for:` is reset by a data gap, so before the scrape_timeout
      # fix a real 6h-old stall would have flapped exactly like the ghost row
      # did, defeating the pending window. `for: 10m` damps a transient count
      # (e.g. a single bad scrape's read); `keep_firing_for: 30m` is the
      # actual anti-flap primitive — it means a brief series gap (a scrape
      # that still times out occasionally, or a Prometheus restart) no longer
      # resolves the alert, which is what turned one stall into 51 resolve/
      # fire pairs a night.
      - alert: HimmelFlowRunStalled
        expr: flow_run_outcome_total{outcome="stalled",flow!="armed-resume"} > 0
        for: 10m
        keep_firing_for: 30m
        labels:
          severity: page
        annotations:
          summary: 'Flow {{ $labels.flow }} has a run stalled past its deadline'

      # HIMMEL-918 failure mode (backstop): the 4-day silently-disabled
      # harvest task — covered directly by HimmelScheduledTaskDisabled below,
      # but last-success age is a backstop that pages even for a flow with no
      # scheduled_task_* coverage at all (e.g. armed-resume flows). Per-flow
      # threshold is 2x the declared cadence_seconds (design §5), joined by
      # the `flow` label entirely in PromQL — a flow missing EITHER series
      # (no completed run ever, or no declared cadence) is silently absent
      # from the join, never a fabricated firing (dark tile, not alerting;
      # design §1.3).
      - alert: HimmelFlowLastSuccessAgeExceeded
        expr: (time() - flow_run_last_success_timestamp) > on (flow) (2 * flow_cadence_seconds)
        for: 0m
        labels:
          severity: page
        annotations:
          summary: 'Flow {{ $labels.flow }} last success is older than 2x its cadence'

      # HIMMEL-918 failure mode: the harvest task sat disabled for 4 days
      # with nothing noticing. `on (task)` keeps the two families' identical
      # `task` label sets joined explicitly rather than relying on default
      # vector matching. HIMMEL-2075: `unless on (task) (scheduled_task_
      # expected_disabled == 1)` exempts tasks the operator has allowlisted
      # (ObservabilityConfig.expected_disabled_tasks) as intentionally
      # disabled right now — but it is scoped to ONLY the `enabled == 0` arm,
      # not the whole OR. An allowlisted task that gets DELETED entirely
      # (scheduled_task_exists == 0) must still page: the allowlist promises
      # continued exists/enabled coverage for anything other than the
      # disabled state itself, and folding `unless` over the combined
      # expression would silently swallow that deletion too (CR-flagged,
      # codex-1).
      - alert: HimmelScheduledTaskDisabled
        expr: ((scheduled_task_enabled == 0) unless on (task) (scheduled_task_expected_disabled == 1)) or on (task) (scheduled_task_exists == 0)
        for: 0m
        labels:
          severity: page
        annotations:
          summary: 'Scheduled task {{ $labels.task }} is disabled or missing'

      # Host RAM runaway per agent process tree (design §4.1). HIMMEL-2075:
      # a flat 6 GiB threshold pages on ordinary overnight-swarm fanout (the
      # incident that prompted this was ~16.8 GiB during a legitimate 6-worker
      # swarm). Scale the threshold by concurrent subagent count instead of
      # adding per-class config: base 6 GiB + 1 GiB per active subagent above
      # 2 (subagent_active_total{host,subagent_type}, HIMMEL-1052). `sum(...)`
      # collapses the per-host/type series to one number — station-wide
      # fanout, not per-class, is what's wanted; `or vector(0)` guards it
      # against an absent subagent_active_total series (no session ledger
      # yet). `clamp_min(..., 2)` floors the count at 2 BEFORE subtracting so
      # the multiplier can never go negative (clamp_min takes an instant
      # vector, not a scalar, so the floor has to happen pre-scalar()); the
      # final scalar() converts the single-element result to the number `>`
      # needs. Tune the two literals against real swarm episodes; edit both
      # here and in the Grafana-provisioned twin.
      # HIMMEL-2149: class="other" is host-detectors.ps1's explicit catch-all
      # for everything NOT descended from a recognized agent root (claude,
      # codex-app-server, codex-exec, hermes-gateway, telegram-bridge,
      # mcp-standalone) — by definition the rest of the desktop (browser,
      # chat apps, indexers, memory compression, ...), not an agent tree. On
      # a normal desktop it dwarfs any per-agent-scaled threshold (evidence:
      # 17.5 GiB / 307 processes while the box's single largest process was
      # 1.2 GiB), so it paged permanently regardless of the HIMMEL-2075
      # swarm-scaled threshold. Excluded from the ALERT, not from the
      # dashboard-facing agent_tree_rss_bytes series itself — same
      # "counted, never paged, unless investigated" posture already used for
      # the ambiguous orphan classes below.
      - alert: HimmelAgentTreeRamRunaway
        expr: agent_tree_rss_bytes{class!="other"} > (6442450944 + 1073741824 * scalar(clamp_min(sum(subagent_active_total) or vector(0), 2) - 2))
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: 'Agent tree class {{ $labels.class }} RSS exceeds 6 GiB'

      # Orphan-shaped processes (design §4.2/§5): the default sketch is
      # specifically "any codex-fleet/registry orphan" — the two classes with
      # a direct 918/840 failure-mode lineage. mcp-dead-parent-unattributed
      # and the gateway/app-server orphan classes stay dashboard-visible but
      # unalerted by default per the design's "counted, never reaped ...
      # unless investigated" framing for the ambiguous class.
      - alert: HimmelOrphanProcesses
        expr: orphan_process_count{class=~"codex-fleet|codex-exec-registry"} > 0
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: '{{ $labels.class }} orphan count is {{ $value }}'

      # Watcher-down (design §5): the collector itself dying must not be
      # single-covered by rules that depend on it. Scoped to the two
      # himmel-owned exporters (flow-exporter, windows_exporter) — Prometheus
      # dying is not expressible as a metric Prometheus itself evaluates.
      # HIMMEL-2365: `for: 5m` still paged 11 times/24h on load-induced
      # scrape-miss bursts (102 misses/24h, mostly singletons under suite
      # load; 91 pending vs 11 firing shows most already resolved before 5m
      # — the rest were bursts long enough to cross it). `for: 10m` absorbs
      # a bigger burst while staying well under the 15m ceiling for a real
      # exporter death.
      - alert: HimmelWatcherDown
        expr: up{job=~"flow-exporter|windows_exporter"} == 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: 'Exporter job {{ $labels.job }} is down'

      # Inbox backlog rising monotonically for 3 days (design §5) —
      # approximated as "higher now than 3 days ago", the standard PromQL
      # idiom for a sustained-rise check; a `for: 1h` grace absorbs a single
      # noisy scrape either side of the 3d boundary.
      - alert: HimmelLunaInboxBacklogRising
        expr: luna_inbox_backlog - (luna_inbox_backlog offset 3d) > 0
        for: 1h
        labels:
          severity: warn
        annotations:
          summary: 'Luna inbox backlog stage {{ $labels.stage }} has risen over the last 3 days'

      # HIMMEL-1635 follow-up to the HIMMEL-1052 session families: a session
      # with an unpaired start row whose transcript went stale — crashed,
      # killed, or wedged. `session_dead_total` is a plain per-host GAUGE
      # (flow-exporter.ts), so this is a level check, same reasoning as
      # HimmelFlowRunStalled above: the exporter's own staleness threshold has
      # already elapsed, a terminal fact observed after the fact, not a rate.
      # HIMMEL-2075: the exporter caps how long a dead session stays counted
      # in `session_dead_total` at SESSION_DEAD_ALERT_TTL_SECONDS (24h) —
      # without a rule-side window, this gauge previously paged continuously
      # for the entire 14d ledger backlog rather than just newly-dead
      # sessions. The rule expression itself is unchanged; the fix is
      # exporter-side (flow-exporter.ts has no per-sample age label for
      # PromQL to window against).
      # HIMMEL-2149: downgraded page -> warn. Confirmed mechanism (not a
      # guess): the himmel end-row hook is already on the fastest available
      # path (scripts/observability/session-run-hook.ts session-end enqueues
      # through scripts/hooks/stop-queue.mjs, the HIMMEL-2004 bounded
      # detached-worker queue — durable, sub-second, immune to the harness's
      # own SessionEnd teardown budget once the entry is written), yet ghost
      # sessions (transcript idle 16-23h, no end row, started AFTER that
      # queue landed 2026-08-22) are still observed — see HIMMEL-2148, the
      # openai-codex plugin's own 5s-timeout SessionEnd hook that "poisons"
      # the whole SessionEnd envelope (HIMMEL-1902 precedent) and can keep
      # OUR hook from ever running, a harness-level defect outside this
      # repo's hooks. Neither offered fix candidate closes it further from
      # here: the detach pattern is already applied, and a pid/transcript
      # reconciler is infeasible — SessionStart hook payloads never carry a
      # numeric pid (empirically confirmed: 862/862 ledger rows null) and
      # the transcript carries no closing marker, so synthesizing a
      # crash-vs-clean verdict would be fabricating a state this codebase's
      # own convention explicitly refuses (see the "dark tile, not a
      # fabricated firing" reasoning elsewhere in this file).
      #
      # Severity ALONE does not reduce Telegram noise here — the flat
      # notification policy (provisioning/alerting/policies.yaml) pings the
      # same contact point on the same repeat_interval regardless of
      # severity (panel round 5, codex-2 caught this: an earlier version of
      # this comment claimed warn stopped interrupting, which was false
      # under that flat policy). The actual noise reduction is the nested
      # `severity = warn` route added there, which drops the repeat interval
      # to 168h (7d) instead of the page-level 12h — warn still delivers,
      # just far less often, appropriate for what evidence shows is
      # presently a false-positive-dominated gauge. Revisit once HIMMEL-2148
      # lands (its own fix would remove the false positives at the source,
      # and this could revert to page + the default 12h route).
      #
      # HIMMEL-2365: `for: 0m` fired on every 0->1 crossing and the resolve
      # right after closed the group, so Telegram got a FIRING+RESOLVED pair
      # per episode (48/24h, 38/6h) — the repeat_interval above is
      # irrelevant to that, since each episode is a new crossing, not a
      # repeat. `for: 10m` debounces that; the exporter's own cleanup/TTL
      # usually clears a false-positive well inside 10m.
      - alert: HimmelSessionDead
        expr: session_dead_total > 0
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: 'Host {{ $labels.host }} has {{ $value }} dead session(s)'

      # ---- HIMMEL-1604: kernel pool + commit pressure -------------------
      # OVERLORD8 has two reboot-only kernel-pinned leak families (File /
      # nonpaged and Token / paged) that track file-handle churn. Two long
      # diagnostic sessions (2026-07-20, 2026-08-06) were spent on this
      # because nothing watched the metrics windows_exporter's `memory`
      # collector was already scraping. Per-tag File/Toke breakdown needs the
      # poolmon textfile exporter (HIMMEL-1166) and is NOT here — these four
      # rules use only what is already scraped.
      #
      # Thresholds are literal defaults, same convention as
      # HimmelAgentTreeRamRunaway above: tune by editing the expression here
      # AND its Grafana-provisioned twin. Calibration evidence (2026-08-20/23):
      # quiet post-boot steady state ~1.9-2 GiB, 44 min after a reboot 6.1 GiB
      # (2.05 NP / 4.08 P), pre-reboot peak ~21 GiB (11.8 P / 9.3 NP). 12 GiB
      # sits above every observed healthy value and well below the peak, so a
      # warn leaves hours of headroom to attribute the leak while the causing
      # process is still running; 18 GiB is the "act now" band.

      # Absolute level, warn. `for: 15m` rides out a single scrape spike.
      - alert: HimmelKernelPoolHigh
        expr: windows_memory_pool_nonpaged_bytes + windows_memory_pool_paged_bytes > 12884901888
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: 'Kernel pool total exceeds 12 GiB on {{ $labels.instance }}'

      # Absolute level, page. Only a reboot reclaims kernel-pinned pool, so by
      # this band the remaining choice is when to take the restart, not
      # whether to.
      - alert: HimmelKernelPoolCritical
        expr: windows_memory_pool_nonpaged_bytes + windows_memory_pool_paged_bytes > 19327352832
        for: 5m
        labels:
          severity: page
        annotations:
          summary: 'Kernel pool total exceeds 18 GiB on {{ $labels.instance }} — only a reboot reclaims it'

      # Slope, the rule that actually catches a leak early enough to attribute
      # it. Both incidents were slow accumulations that a level-only alert
      # would have caught long after the offending process exited. Measured
      # slopes: +0.13 GiB/h quiet, +1.2 GiB/h under a 6-worker swarm. 1 GiB/h
      # sustained for a full hour is above ordinary swarm churn and would have
      # fired ~10 h before the 12 GiB level rule on the episode-2 curve.
      # deriv() over a subquery (not rate/increase) because pool bytes are a
      # gauge that legitimately falls — rate() would read every reclaim as a
      # counter reset.
      - alert: HimmelKernelPoolLeakRate
        expr: deriv((windows_memory_pool_nonpaged_bytes + windows_memory_pool_paged_bytes)[1h:5m]) * 3600 > 1073741824
        for: 1h
        labels:
          severity: warn
        annotations:
          summary: 'Kernel pool on {{ $labels.instance }} is growing faster than 1 GiB/h'

      # Commit pressure — the mechanism behind the sluggishness the operator
      # actually noticed. Past ~0.85 Windows stops growing working sets and
      # starts permanently trimming them (episode 2 ran soft faults at
      # 177k-252k/sec with CPU, disk and GPU all idle).
      - alert: HimmelCommitPressure
        expr: windows_memory_committed_bytes / windows_memory_commit_limit > 0.85
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: 'Committed memory exceeds 85% of the commit limit on {{ $labels.instance }}'

      # ---- HIMMEL-2478/2480: hook-chain budget pressure — early warning for
      # the 2026-09-03 spawn-storm hang -------------------------------------
      # scripts/hooks/run-hook-with-bash.js already writes one row per starved
      # chain member to .claude/logs/hook-chain-skips.jsonl (HIMMEL-2060):
      # `skip` = the guard silently did not evaluate the tool call, `deny` =
      # the tool call was refused fail-closed. Nothing read that log before
      # this ticket. flow-exporter.ts's hookChainMetrics folds it into
      # hook_chain_budget_events_recent{action}, a gauge over the trailing
      # 10-minute window.
      #
      # Calibration (MEASURED, not assumed): replaying the real 6179-row skip
      # log over 2026-08-27..2026-09-03 with a 10-minute sliding window
      # stepped by 1 minute, `for: 5m` applied:
      #   - skip > 10: 104 firing minutes over 7 days (0.98% duty cycle); on
      #     the 2026-09-03 hang day it first fires at 06:19 UTC, 131 minutes
      #     BEFORE the ~08:30 UTC spawn-storm hang.
      #   - deny > 2: 131 firing minutes over 7 days (1.24% duty); first fires
      #     06:46 UTC, 104 minutes before the hang.
      # The alternative signal was rejected on evidence: agent_tree_process_
      # count{class="claude"} (already exported) peaked at 451 processes at
      # 02:05 UTC with NO hang at all, and read only 261 at the hang itself —
      # process population does not predict this failure, budget-event rate
      # does. A process-count threshold was considered and does not work here.
      - alert: HimmelHookChainBudgetPressure
        expr: hook_chain_budget_events_recent{action="skip"} > 10
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: '{{ $value }} hook-chain members skipped their budget in the last 10m — early warning for a spawn-storm hang'

      - alert: HimmelHookChainBudgetDenials
        expr: hook_chain_budget_events_recent{action="deny"} > 2
        for: 5m
        labels:
          severity: page
        annotations:
          summary: '{{ $value }} hook-chain must-run guards were denied fail-closed in the last 10m'

      # ---- HIMMEL-2478/2480 CR follow-up: make a degraded hook-chain reader
      # visible -----------------------------------------------------------
      # A critic panel found the reader above can silently fail closed on
      # itself: a per-log read failure or a present-but-unreadable
      # .claude/worktrees directory both used to surface ONLY as a `#` scrape
      # comment on hook_chain_budget_events_recent — and a Prometheus comment
      # is not alertable, nothing evaluates it. Combined with the family's
      # own explicit-zero contract (an absent log still renders 0), a
      # degraded reader and a genuinely healthy fleet could look identical to
      # every rule above. flow-exporter.ts now also emits
      # hook_chain_skip_log_unreadable, a gauge counting both failure classes
      # (always present, 0 when healthy), so this class of failure gets a
      # real series a rule can fire on instead of prose nobody scrapes.
      # `for: 10m` (longer than the budget rules' 5m) absorbs a transient
      # filesystem blip rather than notifying on it; `warn` not `page`
      # because this degrades a signal, it is not itself a live incident.
      - alert: HimmelHookChainLogUnreadable
        expr: hook_chain_skip_log_unreadable > 0
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: '{{ $value }} hook-chain skip log(s) unreadable — hook_chain_budget_events_recent may be under-counting'
