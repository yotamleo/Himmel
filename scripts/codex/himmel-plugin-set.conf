# himmel's Codex plugin set (HIMMEL-1145) — the ONE definition of it.
#
# Read by install-himmel-codex.{sh,ps1} (what to register + enable) and by
# startup-health.{sh,ps1} (what must STILL be registered + enabled). Edit here and
# both follow; never restate these names in a script.
#
# Format: `<key>: <value>` per line; values are space-separated. `#` starts a
# comment line. Keys:
#   marketplace  the himmel marketplace name (marketplace/.claude-plugin/marketplace.json)
#   default      plugins install-himmel-codex enables with no flags — and the set
#                startup-health requires (all @<marketplace>)
#   all-extra    plugins only `install-himmel-codex --all` adds; NOT required
marketplace: himmel
default: himmel-ops handover obsidian-triage telegram-himmel
all-extra: luna-correlate pr-review-toolkit-himmel
