name: CI

on:
  # PR gating (HIMMEL-594): the cheap ubuntu-only jobs run on every PR so a
  # non-conventional commit, a secret, a shellcheck warning, or a failing shell
  # suite blocks merge. The EXPENSIVE multi-OS matrix is nightly-only — the
  # shell-unit-shard matrix below expands to windows only on `schedule`
  # (HIMMEL-3853: there is no dispatch input that widens it any more), so
  # neither a PR nor a manual dispatch can occupy the paid legs. macOS is not in
  # this file at all (HIMMEL-3902): it runs on its own twice-weekly workflow,
  # macos-cadence.yml, so a macOS red can never turn this run -- or main -- red.
  # `shell-unit` itself (HIMMEL-2872) is the aggregating gate over that
  # matrix — see its own comment block below.
  pull_request:
  # Post-merge verification (HIMMEL-511): re-run the cheap ubuntu gates when code
  # lands on main, catching anything that reached main outside the PR path. The
  # shell-unit-shard matrix stays ubuntu-only on `push` (the paid windows leg
  # is schedule-only), so this adds no multi-OS cost.
  push:
    branches: [main]
  # A plain dispatch runs the ubuntu-only matrix, same as a push. It takes no
  # inputs on purpose (HIMMEL-3853): a per-PR all-OS dispatch held 14 of the
  # account's 20 concurrent job slots on 2026-09-29.
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'   # nightly, UTC

permissions:
  contents: read

# HIMMEL-3217 / HIMMEL-3226: a newer run cancels the run it supersedes -- on
# 2026-09-19 stale runs kept the Actions queue at 5+ and leg PR runs waited
# 25-40 min. Three DISJOINT groups (a workflow has one top-level block):
#   pull_request -> ci-pr-<PR number>: a PR's newer push cancels that PR's
#                   older run, and never another PR's;
#   push         -> ci-<github.ref>: push is restricted to `main` above, so
#                   these runs share ONE group (ci-refs/heads/main) and are
#                   NOT cancelled while running (HIMMEL-3841 slice E): at most
#                   one sweep runs and one waits, and a newer pending sweep
#                   replaces the older pending one (verified on #1429: a
#                   superseded pending run cancels with 0 jobs and leaves no
#                   context). Each completed sweep therefore tests the tip at
#                   its start, so the completed sweeps cover contiguous ranges
#                   of merges and a red on main is always attributed to a
#                   range (see main-sweep-red.yml);
#   everything else (schedule, workflow_dispatch) -> ci-<run_id>: unique to the
#                   run, so the nightly / a dispatch is never cancelled nor
#                   queued behind anything.
# cancel-in-progress is scoped to pull_request alone, so it stays inert for the
# push and run_id groups. A cancelled run only ever belongs to a superseded
# head: the required checks (incl. the `shell-unit` aggregator) are evaluated
# on the PR's current head, whose own run this never cancels.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/check-no-secrets.sh

  # HIMMEL-3653: HIMMEL-3624 fixed a bracket-expression bug in
  # scripts/lib/unchecked-mktemp.sh that only failed under a real BWK
  # (one-true-awk) — `gawk --posix`/`--lint=fatal` both accept the broken
  # regex (J1288O), so a lint substitute would not catch this class of
  # regression, and Ubuntu PR CI runs everything else under gawk. The only
  # prior BWK coverage was the nightly macOS shell-unit-shard leg (now the
  # os:macos cadence, macos-cadence.yml), which is advisory to main, so a
  # regression here previously reached main unnoticed. This job builds a pinned one-true-awk commit from source
  # (never a branch) and runs the gate's own suite under it, gating every PR.
  bwk-awk-mktemp-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/run-unchecked-mktemp-under-bwk.sh

  # Commit-time / pre-commit backstop for the 5 leak classes (HIMMEL-2561 /
  # HIMMEL-2705 step 2): catches anything that slipped past the pre-commit
  # hook (a --no-verify commit, a merge, a stale clone) by re-scanning the
  # whole tracked tree. Public CI has no station-local denylist file, so the
  # hostname class self-skips here (see leak-classes.sh header) — the other
  # 4 classes still run.
  leak-classes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # This is a pull_request workflow, so it checks out and executes
          # contributor code. The default persists the GITHUB_TOKEN into
          # .git/config, where that code can read it.
          persist-credentials: false
      - run: bash scripts/guardrails/leak-classes.sh --tree

  # Trust-path git subprocess calls must scrub GIT_DIR/GIT_WORK_TREE/
  # GIT_COMMON_DIR/GIT_INDEX_FILE before invoking git — an attacker-set value
  # otherwise steers which repo/worktree/index the call answers about
  # (HIMMEL-3570; already caught twice as real bugs, PR 1212 and PR 1217).
  git-env-scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash scripts/guardrails/check-git-env-scrub.sh --tree

  # Commit-message governance (HIMMEL-594/1483): every non-exempt commit in the
  # PR range must be conventional and ticket-traceable. Reuses the local
  # commit-msg gate (scripts/hooks/check-commit-msg.sh) over the range so CI and
  # the author-time hook agree. fetch-depth: 0 → full history for the range walk.
  commit-lint:
    runs-on: ubuntu-latest
    env:
      TICKET_ID_REQUIRED: '1'
      JIRA_PROJECT_KEY: HIMMEL
      TICKET_ID_TRUSTED_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint commit messages in the PR range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/ci/check-commit-range.sh --merge-ref "${{ github.event.pull_request.base.sha }}"
          else
            bash scripts/ci/check-commit-range.sh
          fi
      # HIMMEL-3616: the PR-title lint (the squash merge makes the title
      # main's commit subject) lives in its own workflow,
      # .github/workflows/pr-title-lint.yml — not here. commit-lint's
      # `pull_request:` trigger has no `edited` type, so a step here would
      # never re-run when a title is fixed via `gh pr edit --title`
      # (judge J1284O F2); it also never threaded the PR author into
      # TICKET_ID_AUTHOR, so the dependabot[bot] exemption never applied to
      # a title (judge J1284O F1).

  # Plugin-version-bump governance (HIMMEL-3551): mirrors the local
  # plugin-version-bump-required pre-commit hook (--bump-required), which only
  # sees STAGED files at commit time, over the whole PR range — so a commit
  # that changes a marketplace/plugins/<p>/ file without bumping that plugin's
  # plugin.json version is caught even when pre-commit was skipped/bypassed.
  # fetch-depth: 0 → the base ref is reachable for the range diff. On `push`
  # (post-merge to main) there's no PR base to diff against and nothing new to
  # gate, so this only runs on pull_request.
  plugin-version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every plugin file changed in the PR range bumped its version
        run: bash scripts/check-plugin-drift.sh --bump-required "${{ github.event.pull_request.base.sha }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --severity=warning makes the gate deterministic across shellcheck
      # versions: SC2329 (note-level, "function never invoked") is the only
      # check newer shellchecks add over the pre-commit-pinned 0.10.x, and it
      # only fires on pre-existing files. pre-commit stays the strict
      # style-level local gate; CI catches warnings+errors regardless of the
      # runner's shellcheck version.
      # git pathspec `*` crosses `/`, so 'scripts/*.sh' matches every depth
      # (top-level setup.sh/adopt.sh/… included). 'scripts/**/*.sh' would NOT —
      # in a git pathspec `**/` requires an intervening directory, silently
      # dropping the 34 top-level scripts. xargs -r: no files -> don't run
      # shellcheck on stdin.
      # scripts/lanes/bench/fixtures/ holds benchmark INPUT scripts — sample
      # shell fed to the lane bench as the thing being measured. Adding
      # shellcheck directives to them would change the artifact under
      # measurement, so they're excluded the same way scripts/statusline/ is.
      - run: git ls-files -z 'scripts/*.sh' | grep -zv '^scripts/statusline/' | grep -zv '^scripts/lanes/bench/fixtures/' | xargs -0 -r shellcheck --severity=warning

  node-suites:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [jira, bitbucket, himmel-run, ci-orchestrator]
        # HIMMEL-3813: the two plugin packages live under plugins/, not scripts/.
        # `include` keeps the scripts/* context names (`node-suites (jira)`) that
        # branch protection may require, and adds one per plugin.
        include:
          - pkg: himmel-gh
            dir: plugins/himmel-gh
          - pkg: himmel-jira
            dir: plugins/himmel-jira
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.dir || format('scripts/{0}', matrix.pkg) }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.dir || format('scripts/{0}', matrix.pkg) }}
      - run: npm test
        working-directory: ${{ matrix.dir || format('scripts/{0}', matrix.pkg) }}

  # HIMMEL-3813: nothing built or ran the jira dist CLI end to end; the unit suite
  # mocks `request`, so a broken tsc build or a dist that crashes at startup merged
  # green. Offline and secret-free (dummy JIRA_* values, a local mock server).
  jira-cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/jira/package-lock.json
      - run: npm ci
        working-directory: scripts/jira
      - run: bash scripts/ci/jira-cli-smoke.sh

  lanes-and-trust-suites:
    # HIMMEL-689: scripts/lanes is a zero-dependency ESM test package — no
    # package.json (a committed one under scripts/ trips the npm-audit gates for a
    # package with nothing to install). Run its node:test suites directly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # HIMMEL-1560: the trust suite's skew regression reads the REAL
          # historical recorder out of git (`git show c49716d5:…`) rather than a
          # synthetic stub, because the thing under test is that an OLD
          # recorder answers `capabilities` with exit 0 and empty stdout. The
          # default checkout is shallow (depth 1), so that object is absent and
          # the test — which ASSERTS the `git show` succeeds rather than
          # silently substituting a stub — would fail here. Full history is the
          # fix; degrading the test to a stub in CI would delete exactly the
          # evidence it exists to provide.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # HIMMEL-2587: the bench-run-batch dispatch-luna tests shell out to
      # scripts/lanes/bench/bank-snapshot.sh, which runs bun. Without bun the
      # snapshot answers UNKNOWN for both banks and run-batch.sh correctly
      # refuses to start a paid attempt — so those tests abort fail-closed
      # before reaching their assertions and the job stays red. Installing bun
      # keeps the retry-cap / resume / mid-batch-abort contract under a runner
      # check; SKIP-guarding them instead would exit 0 with nothing exercised.
      - uses: oven-sh/setup-bun@v2
      - run: node --test "scripts/lanes/tests/**/*.test.mjs"
      # HIMMEL-1529: same shape — a zero-dependency node:test suite outside any
      # package.json. Listed explicitly because nothing globs for it; an
      # unlisted suite is a suite nobody runs.
      #
      # `ls` first because `node --test` reports zero tests and exits 0 when the
      # glob matches nothing: a renamed or deleted suite would go green with
      # nothing executed. `ls` on an unexpanded pattern fails, so the step does.
      - run: ls scripts/trust/tests/*.test.mjs && node --test "scripts/trust/tests/*.test.mjs"
      # HIMMEL-3028: the scripts/hooks + scripts/lib node:test suites
      # (HIMMEL-1578) ran ONLY in the local pre-commit hook until now — that
      # hook deliberately skipped ci.yml because Actions was off on the
      # private repo and the public mirror lacked .claude/settings.json (the
      # wire-hook-bash fixture source). Both premises died 2026-09-09: origin
      # is the public repo with Actions on every PR, and .claude/settings.json
      # is tracked there. Pre-commit stays the fast local gate; this is the
      # authoritative check a bypassed or skipped local hook can no longer
      # dodge (HIMMEL-3025 is exactly the kind of leak this surfaces).
      - run: bash scripts/hooks/check-hook-lib-suites.sh

  guardrail-matrices:
    # HIMMEL-1522: the egress matrix decides whether a corpus may leave the
    # machine and the voice policy decides what a spoken request may do. Both
    # were standalone scripts that only ran when someone remembered to type
    # them. Also wired into pre-commit, which is the layer that matters most
    # here — Actions is OFF on the private repo, so a green private PR is not
    # evidence either suite ran.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # This is a pull_request workflow, so it checks out and executes
          # contributor code. The default persists the GITHUB_TOKEN into
          # .git/config, where that code can read it.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: bash scripts/hooks/check-guardrail-matrices.sh

  # Matrix, not ubuntu-only (HIMMEL-1109). This suite spawns the luna-vitals CLI
  # and connectors/pull-cadence.sh as subprocesses, so it is exactly the kind of
  # suite whose result depends on the host — and it sat red on Windows for
  # months (12 tests when the ticket was filed, 3 by the time anyone looked
  # again) because CI only ever saw Linux. macOS is deliberately
  # left out: GitHub bills those runners 10x, and this suite has no macOS-only
  # surface beyond the BSD-vs-GNU `date` fallback in pull-cadence.sh, which the
  # tests bypass by pinning FROM/TO.
  #
  # HIMMEL-3125: Windows is now the alpha tier — dropped off the per-PR path,
  # same pattern as shell-unit-shard below. Every non-schedule event (a
  # workflow_dispatch included) runs ubuntu only; `schedule` alone adds the
  # windows-latest leg, paid once a night.
  # continue-on-error scopes non-gating to that leg alone; ubuntu-latest stays
  # the required check either way.
  #
  # `shell: bash` because the run lines below chain with `&&` — the default
  # shell on windows-latest is pwsh. `fail-fast: false` so a red Windows leg
  # still reports the Linux result instead of cancelling it.
  bun-suites:
    # issues:write (beyond the workflow-level contents:read) is needed only by
    # the windows-nightly-issue.sh steps above/below — scoped to this job
    # alone rather than raised workflow-wide.
    permissions:
      contents: read
      issues: write
    # HIMMEL-3125: serializes the windows-nightly-issue.sh reconciliation.
    # matrix.os keeps normal per-PR/per-ref ubuntu-latest runs from queuing on
    # each other (each PR branch gets its own group, via github.ref). The
    # windows-latest leg is the one that mutates the shared, repo-wide
    # tracking issue, and the windows leg once ran on a dispatch from ANY
    # branch -- not only main -- so that leg drops github.ref from its group
    # and shares ONE group across every ref (CodeRabbit finding, PR #788;
    # HIMMEL-3853 removed the dispatch path, the shared group is kept as
    # cheap insurance). Queue
    # (cancel-in-progress: false) rather than cancel, so neither run's
    # list-then-create against the tracking issue overlaps the other's.
    concurrency:
      group: bun-suites-${{ matrix.os }}-${{ matrix.os == 'windows-latest' && 'shared' || github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'schedule'
               && fromJSON('["ubuntu-latest","windows-latest"]')
               || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: cd scripts/luna-vitals && bun install --frozen-lockfile && bun test
      # Must run from the repo root, not scripts/telegram/ — these suites pin
      # their fixtures repo-root-relative, so running them from their own
      # directory fails every wired case (docs/internals/environment-gotchas.md,
      # "The bun test cwd is per-suite"). No `bun install` needed: scripts/telegram
      # has no package.json of its own and the suites run against the repo tree.
      # This is the largest bun test surface in the repo (971 tests) and had no
      # CI step at all until HIMMEL-2620. It runs on both matrix legs because
      # three of its cases are platform-sensitive by construction.
      - run: bun test scripts/telegram --dots
      # HIMMEL-3215: the luna source-identity suites (source-identity +
      # backfill, 40 tests) had no CI step, so a regression in
      # scripts/vault/** could merge green. Runs from the repo root like the
      # telegram suite (fixtures are repo-relative). Hermetic: a stub `gh` and a
      # preloaded fetch stub, no network, no live vault. Ubuntu only — the
      # backfill suite prepends a bash `gh` stub to PATH with a `:` separator
      # and calls execFileSync("gh"), which windows-latest cannot resolve, so
      # the non-gating Windows nightly would go red and file a spurious issue.
      # A step in this job (not a new job) rides the already-required
      # `bun-suites (ubuntu-latest)` context: no branch-protection change.
      - name: Vault tests (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: bun test scripts/vault/tests --dots
      # --frozen-lockfile fails if bun.lock has drifted from package.json. Catches
      # the class of bug where a dep range is bumped in package.json but the
      # lockfile is never regenerated (HIMMEL-553). HIMMEL-2620 wired the test
      # run for the suite that was always there under tests/.
      - run: cd marketplace/plugins/luna-correlate && bun install --frozen-lockfile && bun test
      # HIMMEL-3813: telegram-himmel's own suite (tests/poller-gate-shape.test.ts)
      # had no CI step. Ubuntu only, like the vault step: its fixtures are
      # POSIX-shaped and a red non-gating Windows leg would file a spurious issue.
      - name: telegram-himmel plugin tests (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: cd marketplace/plugins/telegram-himmel && bun install --frozen-lockfile && bun test
      # A red Windows nightly must not fail silently now that it is non-gating
      # (HIMMEL-3125): upsert one consolidated issue rather than opening a new
      # one per run (same convention as scripts/ci/fork-drift-issue.sh). Two
      # steps rather than one because the Actions expression language has no
      # `steps.*.outcome` wildcard to fold into a single rc — `success()` /
      # `failure()` already summarize every prior step in this job. Both are
      # scoped to the windows-latest leg only: the ubuntu-latest leg already
      # gates the PR/push path and needs no issue.
      - name: Windows-nightly issue — clear on green
        if: success() && matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/windows-nightly-issue.sh 0 "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Windows-nightly issue — file/refresh on red
        if: failure() && matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/windows-nightly-issue.sh 1 "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # CLAUDE.md-derived content invariants (HIMMEL-1305). The local pre-commit
  # copies of these gates judge the STAGED source, but they execute the repo's
  # own tooling — scripts/agents-md/generate.mjs, scripts/guardrails/lib.sh, and
  # the gate scripts themselves — from the WORKING TREE. An unstaged edit to
  # that tooling can therefore approve a commit the edit is not part of.
  # himmel accepts working-tree execution as the local convention (rationale:
  # docs/internals/enforcement.md § Gates execute working-tree tooling); this
  # job is the backstop. A CI checkout has no working tree to diverge from, so
  # running the SAME gate scripts here validates committed source with committed
  # tooling by construction.
  #
  # WHERE THIS RUNS: Actions is disabled on the private repo by design (the
  # split is pre-commit locally, Actions on the public mirror), so this job
  # gates the PUBLIC tree after propagation — not the private PR. That is still
  # worth having: propagation is a re-projection, an independent diff surface
  # where a CLAUDE.md/AGENTS.md/debrand inconsistency would land unchecked.
  # Do not read a green private PR as evidence these gates ran.
  #
  # These gates are himmel-dev-only — they no-op without the gitignored
  # `.himmel-dev` marker, which keeps them off for adopters running himmel as a
  # harness. CI is a contributor context, so create the marker first, otherwise
  # every step below silently passes without checking anything.
  doc-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Enable the himmel-dev gates in this checkout
        run: touch .himmel-dev
      # Guard the guard: proves the three gates below catch a stale AGENTS.md,
      # an orphaned debrand rule, and a re-introduced lane-inventory token —
      # and that they do NOT without the staging step.
      #
      # MUST run BEFORE the staging step. It clones this checkout, and the
      # staging step leaves HEAD on an unborn branch — cloning a repo whose HEAD
      # is unborn yields "you appear to have cloned an empty repository" and an
      # EMPTY worktree, so the test would validate nothing and die on setup.
      - name: The doc-invariants job itself is not a no-op
        run: bash scripts/hooks/test-ci-doc-invariants.sh
      # HIMMEL-2037 — the pre-commit `skill-description-cap` hook only sees
      # STAGED files, so it cannot catch an over-cap description that arrived
      # via a bypassed hook. This step re-runs the same lint over the whole
      # tracked set. It takes paths directly, so it needs no staging step and
      # must stay ABOVE the destructive orphan checkout below.
      # -z / xargs -0, not $(…): a tracked path containing whitespace would be
      # word-split by command substitution and the lint would read nonexistent
      # fragments instead of the real file.
      - name: Skill/command descriptions stay within the 120-char cap
        run: git ls-files -z '.claude/commands/*.md' '.claude/skills/*/SKILL.md' '.agents/skills/*/SKILL.md' 'marketplace/plugins/*/commands/*.md' 'marketplace/plugins/*/skills/*/SKILL.md' | xargs -0 node scripts/lanes/skill-cost.mjs --max-desc 120
      # HIMMEL-2051 — same rationale as the description-cap step above: the
      # pre-commit `command-positional-args` hook only sees staged files, so
      # this re-runs the same lint over the whole tracked set.
      # claude-hud is excluded: it is pinned byte-for-byte (HIMMEL-718) and
      # gated by its own drift guard below, not this lint.
      - name: Commands have no bare $<digit> in their fenced code
        run: git ls-files -z '.claude/commands/*.md' 'marketplace/plugins/*/commands/*.md' -- ':!marketplace/plugins/claude-hud' | xargs -0 node scripts/lanes/skill-cost.mjs --check-positional-args
      # HIMMEL-2064 — docs/commands-catalog.md's Description column is
      # generated from `.claude/commands/*.md` frontmatter; this refuses a
      # divergent hand-edit. Reads the tracked files directly, so it needs no
      # staging step and must stay ABOVE the destructive orphan checkout below.
      - name: commands-catalog.md Description column matches command frontmatter
        run: node scripts/lib/gen-commands-catalog.mjs check
      # HIMMEL-2176 Task 5 — .env.example's generated secrets block is
      # rendered from scripts/himmelctl/lib/secrets-manifest.json; this
      # refuses a divergent hand-edit of either file. Reads the tracked files
      # directly (non-staged check), so it needs no staging step and must
      # stay ABOVE the destructive orphan checkout below, same as the
      # commands-catalog check just above it.
      - name: .env.example's generated secrets block matches secrets-manifest.json
        run: node scripts/lib/gen-secrets-doc.mjs check
      # HIMMEL-2832/2848 — the v1 adopter docs' executable invariants
      # (budget/forbidden-classes/link-resolution, qualified "profile" +
      # live path/env references) were run by hand only; this wires them into
      # CI. Both checkers read the tracked files directly (no git-diff/staged
      # dependence), so they need no staging step and must stay ABOVE the
      # destructive orphan checkout below, same as the checks just above.
      - name: v1 adopter docs pass the llms.txt link/budget invariants
        run: |
          bash scripts/docs/check-llms-links.sh llms.txt
          bash scripts/docs/check-llms-links.sh docs/setup/install.md
          bash scripts/docs/check-llms-links.sh docs/setup/migrating.md
      - name: v1 adopter docs pass the qualified-"profile" + live-reference invariants
        run: bash scripts/docs/check-doc-terms.sh llms.txt docs/setup/install.md docs/setup/migrating.md
      # HIMMEL-2978 — mirrors the pre-commit marketplace-source-hermetic hook
      # so a PR editing the template is gated even when pre-commit was
      # skipped. Reads the tracked template directly (no git-diff/staged
      # dependence), so it needs no staging step and must stay ABOVE the
      # destructive orphan checkout below, same as the checks just above.
      - name: settings-template marketplace sources stay hermetic
        run: bash scripts/check-marketplace-source-hermetic.sh
      # LOAD-BEARING — do not remove (HIMMEL-1305). These gates are pre-commit
      # hooks: each triggers off `git diff --cached` and exits 0 when its inputs
      # are not staged. A CI checkout's index is identical to HEAD, so without
      # this step every gate below no-ops and the job goes green having checked
      # nothing.
      #
      # `checkout --orphan` (NOT `read-tree --empty && add -A`) — the difference
      # is not cosmetic. Re-adding against an unborn HEAD stages the whole tree;
      # re-adding against the REAL HEAD reconstructs an index identical to it, so
      # `git diff --cached` is empty again and nothing fires. That variant appears
      # to work on Windows only because CRLF normalization leaves incidental
      # differences — on this ubuntu runner it stages exactly nothing.
      #
      # This is destructive to the checkout's HEAD, so it goes LAST before the
      # gates and nothing after it may rely on HEAD being a real branch.
      - name: Stage the committed tree so the gates actually fire
        run: git checkout -q --orphan ci-doc-invariants && git add -A
      - name: AGENTS.md is regenerated from CLAUDE.md
        run: bash scripts/hooks/check-agents-md-fresh.sh
      - name: Every debrand rule still matches CLAUDE.md
        run: bash scripts/hooks/check-debrand-coverage.sh
      - name: Lane inventory stays out of CLAUDE.md prose
        run: bash scripts/hooks/check-lanes-inventory.sh

  # Security / dependency scanning lane (HIMMEL-510): mirrors the local
  # pre-commit/pre-push security gates (.pre-commit-config.yaml) by invoking the
  # SAME scripts/hooks/* gate scripts, so CI and the author-time hooks stay in
  # lockstep — a vuln/license/lockfile/secret problem that blocks a local push
  # also blocks the PR. Secret-free + ubuntu-only; the only network reached is
  # public (GitHub releases for the gitleaks binary, the npm registry for audit/
  # license/signature checks). Deferred to a follow-up: bandit (python SAST —
  # needs a baseline #nosec triage of pre-existing VM/SSH tooling before it can
  # gate green) and better-npm-audit (redundant with the npm-audit gate below).
  security-scan:
    runs-on: ubuntu-latest
    # This job does the most network I/O in the workflow (gitleaks download +
    # `npm ci` across ~9 packages); cap it so a hung download/install can't
    # burn a full 6h runner slot (codex-3 CR hardening).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - uses: oven-sh/setup-bun@v2

      # gitleaks: pinned to the SAME version as the pre-commit hook
      # (.pre-commit-config.yaml → gitleaks rev v8.30.1) and reuses .gitleaks.toml,
      # so a secret the local hook catches is caught here too. `dir` scans the
      # checked-out working tree; gitleaks exits non-zero when a leak is found.
      - name: gitleaks secret scan (reuses .gitleaks.toml)
        run: |
          ver=8.30.1
          # Pin the exact release bytes: verify the published SHA256 before
          # extracting/executing, so a tampered or MITM'd download cannot run
          # (it would be silly for the SECURITY lane to run an unverified
          # scanner binary). Update `sha` in lockstep with `ver`.
          sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "${sha}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks dir . --config .gitleaks.toml --redact --no-banner

      # Lockfile integrity (npm + bun) — pre-commit `lockfile-integrity`.
      # npm path is `npm ci --dry-run` (no install needed); bun path is
      # `bun install --frozen-lockfile --dry-run` (setup-bun above provides bun).
      - name: lockfile integrity (npm + bun)
        run: bash scripts/hooks/check-lockfile-integrity.sh

      # uv lock integrity (python) — pre-commit `uv-lock-integrity`. No
      # pyproject.toml in the tree today, so this self-skips (kept for lockstep:
      # the day a python project lands, CI gates its uv.lock with no further edit).
      - name: uv lock integrity (python)
        run: bash scripts/hooks/check-uv-lock.sh

      # npm audit (production, high+) — pre-push `npm-audit`. Self-installs prod
      # deps (`npm ci --omit=dev --ignore-scripts`) for every committed
      # package.json, leaving node_modules in place for the signatures step below.
      - name: npm audit (production, high+)
        run: bash scripts/hooks/check-npm-audit.sh

      # npm license allowlist — pre-push `npm-licenses`.
      - name: npm license allowlist
        run: bash scripts/hooks/check-npm-licenses.sh

      # HIMMEL-2573: this gate has a hard floor (npm >= 11) that the pinned
      # node-version above does not meet — node 22 bundles npm 10.9.8. That
      # floor and this job's runtime can drift apart silently: the only
      # symptom was an error that read like a package problem, and it went
      # unnoticed because it passes on every developer machine (newer npm
      # installed locally) and this repo never ran the workflow before
      # (Actions is off on the private repo by design). Upgrade npm here
      # rather than bumping node-version — node 22 is the tested runtime for
      # the whole workflow and a signature gate shouldn't quietly change that.
      # Print the version so the next time this floor and this runtime drift
      # apart, it's one glance at the log instead of an investigation.
      - name: upgrade npm to meet the audit-signatures floor (>= 11)
        run: |
          npm i -g npm@^11
          npm --version

      # npm audit signatures (production) — pre-push `npm-audit-signatures`. This
      # gate does NOT self-install; it relies on the node_modules the npm-audit
      # step above materialized for the scripts/{jira,bitbucket,himmel-run}
      # packages, so it MUST run after that step.
      - name: npm audit signatures (production)
        run: bash scripts/hooks/check-npm-audit-signatures.sh

  # Multi-OS, gated to the nightly to stay free-tier-cheap: every non-schedule
  # event (a workflow_dispatch included) runs ubuntu only; `schedule` alone
  # adds windows (2x), paid once a night (HIMMEL-3853: Windows is verified by
  # the nightly only, never per PR). macOS (10x) is NOT here (HIMMEL-3902): it
  # is the os:macos cadence, macos-cadence.yml. A red nightly OS leg becomes
  # its own split slice — docs/internals/testing.md.
  # windows is NON-GATING this phase (continue-on-error scoped to the
  # non-ubuntu legs): its per-suite PASS/FAIL is advisory in the job log while
  # ubuntu stays the required gate. Tightening the new OSes to
  # gating-green is the data-driven follow-up (HIMMEL-494 phase 3).
  #
  # This is the working matrix — sharded per OS (HIMMEL-2872) so the ubuntu
  # legs finish in parallel instead of serially. The shard COUNT is spelled in
  # exactly two places, both below and both of which must agree: the `shard:`
  # matrix list and the `--shard …/<n>` run argument. Deliberately not repeated
  # here — a third copy is a third thing to forget. `shell-unit` below is
  # the aggregating gate that rolls this matrix up into the one required
  # check-run context branch protection names.
  shell-unit-shard:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'schedule'
               && fromJSON('["ubuntu-latest","windows-latest"]')
               || fromJSON('["ubuntu-latest"]') }}
        # shard: [1..8] fans run-shell-tests.sh across 8 runners (HIMMEL-2872).
        # The `8` here and the `/8` in the run step below are two spellings of
        # the same number — GitHub Actions has no way to derive one from the
        # other (strategy.job-total counts os×shard, not shard alone), so a
        # change to the shard count must edit both or the split silently stops
        # being a partition. Went from 6 to 8 because 6 measured an 18m23s
        # slowest shard (3m18s fastest) — round-robin, not the count, dumped
        # the corpus's two heaviest suites onto one shard (719s of its 1065s);
        # replaying measured durations predicts 9.9m at 8 but 10.7m at 12, so
        # more shards isn't monotonically better — a duration-aware split is
        # the real fix (follow-up).
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    # HIMMEL-3919: bound the job (default is 6 h; main-push runs share one
    # non-cancelling concurrency group, so one hung shard queued every later
    # main run). The cap is OS-dependent because the nightly SUITE_TIER_MODE=all
    # legs are far slower than the fast-tier push/PR runs: ubuntu shard 8 took
    # 35-38 min and windows shards 79-115 min (run 36579691044; 128 min in run
    # 36443339522). suite-durations.tsv is the fast tier only (~18 min slowest
    # shard). ubuntu 60 is ~1.7x the slowest nightly shard; windows 180 clears
    # the 128 min max. A timed-out job is `cancelled`, which continue-on-error
    # does not absorb, so a windows cap below its real duration would turn the
    # aggregate red every night. There are no macos rows in this matrix
    # (macos-cadence.yml / os-verify.yml carry their own 120).
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 180 || 60 }}
    steps:
      # fetch-depth: 0 (not the default shallow clone) so --changed-since below
      # can resolve a pull_request's base SHA, which a depth-1 checkout of the
      # head ref does not carry.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # arm-resume's non-dry-run cases exercise the real `at` scheduler backend,
      # which the supported runtime provides (HIMMEL-594 `ubuntu.sh` installs +
      # enables at/atd). GitHub's ubuntu image ships without `at`, so CI fell back
      # to the crontab path and ~2 arm-resume cases diverged from a real install.
      # Install + enable it on Linux so CI mirrors the supported runtime
      # (HIMMEL-619). Scoped to Linux: no-op on the nightly windows leg.
      # HIMMEL-2871: the runner image preinstalls third-party apt sources
      # (Google Chrome, Microsoft, Azure CLI) we never use; when one of those
      # goes inconsistent upstream, `apt-get update` exits 100 and this step
      # kills the whole job before any suite runs. Drop those lists first so
      # the update depends only on the Ubuntu archive we actually need.
      # No `.list`/`.sources` suffix on the glob: ubuntu-24.04 runner images
      # ship these as deb822 `.sources` files, not legacy one-line `.list`
      # files, and a suffix-anchored glob silently matched nothing.
      - name: Install + enable at/atd (Linux — arm-resume scheduler backend)
        if: runner.os == 'Linux'
        # HIMMEL-3919: a hung dpkg/apt lock held this step ~1.5 h. Each apt call
        # gets a `timeout` and a dpkg-lock wait so a lock fails fast and visibly
        # instead of blocking silently. HIMMEL-4073: worst case is the 2 min
        # plain install + 5 min refresh + 5 min retry = 12 min, so the step cap
        # is 13 (it was 10 when the whole step was refresh + install).
        timeout-minutes: 13
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft-* /etc/apt/sources.list.d/azure-cli*
          # HIMMEL-4073: try the plain install first (the runner's package
          # index is usually fresh enough); only a failure pays for an index
          # refresh and a retry. Each branch logs which path ran.
          if sudo timeout 120 apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=60 at; then
            echo "at/atd install: plain install succeeded, index refresh skipped"
          else
            echo "at/atd install: plain install failed, falling back to index refresh + retry"
            sudo timeout 300 apt-get update -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120
            sudo timeout 300 apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=120 at
          fi
          sudo systemctl enable --now atd || sudo service atd start || true
      # HIMMEL-2742: same shape as HIMMEL-2587 (lanes-and-trust-suites) — a
      # suite in this corpus (test-wizard-luna-sections.sh) shells out to bun
      # and fails closed ("required test tool not found before PATH scrub:
      # bun") without it. Installing bun keeps that hermetic PATH-scrub case
      # under a runner check; a self-skip would exit 0 with nothing exercised.
      - uses: oven-sh/setup-bun@v2
      # HIMMEL-3193: the run step below now covers marketplace/ (root `.`), where
      # the obsidian-triage suites need js-yaml + playwright from
      # tools/node_modules. ensure-deps.sh installs them and exits non-zero on
      # ANY npm/network failure (no `|| true`, no continue-on-error), so a flaky
      # install fails THIS step loudly instead of surfacing as a dozen
      # unrelated suite reds. Pinned by test-run-shell-tests.sh Case 23f.
      - name: Install obsidian-triage tool deps (marketplace suites)
        run: bash marketplace/plugins/obsidian-triage/tools/ensure-deps.sh
      # HIMMEL-2223 codex-3: scripts/test-template-nostash-hooks.sh hard-SKIPs
      # (exit 0) without pre-commit on PATH — the exact vacuous-SKIP shape
      # called out for the Windows vault suites above (LUNA-131) — so without
      # this install the suite is a permanent no-op here, never exercising the
      # real fixer hooks. `shell: bash` matches the Windows install pattern
      # above: python -m pip works identically on every OS in this matrix.
      - name: Install pre-commit (scripts/test-template-nostash-hooks.sh)
        shell: bash
        run: python -m pip install --disable-pip-version-check pre-commit
      # Explicit `bash` prefix: on windows-latest the default run shell is pwsh,
      # but Git Bash is preinstalled + on PATH, so `bash …` runs under MSYS2.
      # FAIL_LOG_DIR: full failed-suite logs land there and upload as an
      # artifact below — the inline tail is bounded, so without this the
      # failing assertion can be unrecoverable from Actions logs (HIMMEL-963).
      # SUITE_TIER_MODE (HIMMEL-2166): fast on every per-PR/post-merge leg
      # (pull_request, push, or a plain workflow_dispatch) — this job is
      # ubuntu-only there. `all` stays the corpus on the nightly leg that
      # expands to the paid windows matrix, matching the
      # cadence/full-scan intent this ticket must not touch.
      # SUITE_CHANGED_SINCE: only on pull_request, where a base SHA exists —
      # a docs-only PR then skips the whole corpus (run-shell-tests.sh's own
      # docs-only fast lane); push/schedule/dispatch have no PR base to diff.
      # Scan root `.` (HIMMEL-3193) = scripts/ + templates/ + marketplace/; the
      # duration ledger keys all three, so the bin-pack balances across them.
      # SUITE_IMPACTED_FROM_BASE (HIMMEL-3897): on a pull_request to the default
      # branch, the shards run only the suites the BASE commit's
      # scripts/ci/impacted-selection.sh selects for the PR diff — or the full
      # sweep, which it decides for any trust-path change (this file,
      # run-shell-tests.sh, the selector, the trust list), a base that is not on
      # main (spec hole H1), or any doubt. A PR to another branch, push, schedule
      # and dispatch pass '' = the full sweep. The 8 shards stay 8 required
      # contexts either way; a docs-only PR's shards exit 0 with nothing to run.
      # SUITE_MANIFEST: the selection this shard acted on and every suite's fate,
      # uploaded below and verified by the shell-unit aggregator.
      - run: bash scripts/ci/run-shell-tests.sh --shard ${{ matrix.shard }}/8 .
        env:
          FAIL_LOG_DIR: failed-suite-logs
          SUITE_TIER_MODE: ${{ github.event_name == 'schedule' && 'all' || 'fast' }}
          SUITE_CHANGED_SINCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          SUITE_IMPACTED_FROM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == github.event.repository.default_branch && github.event.pull_request.base.sha || '' }}
          SUITE_MANIFEST: shard-manifest/manifest-shard${{ matrix.shard }}.txt
      - name: Upload shard manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shell-unit-manifest-${{ matrix.os }}-shard${{ matrix.shard }}
          path: shard-manifest/
          if-no-files-found: ignore
          retention-days: 14
          # A re-run shard replaces its manifest, so the aggregator reads the
          # latest attempt's.
          overwrite: true
      - name: Upload failed-suite logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: shell-unit-failed-logs-${{ matrix.os }}-shard${{ matrix.shard }}
          path: failed-suite-logs/
          if-no-files-found: ignore
          retention-days: 14
      # LUNA-131 soak/sweeper suites — DORMANT in the private repo (HIMMEL-297:
      # CI lives on the public side). Kept here as reference/commented-out YAML,
      # not wired into any step — no `on:` trigger reaches this block. Un-comment
      # only on the public repo once these suites are ready to gate there.
      # run-shell-tests.sh cannot reach these: it only discovers `test-*.sh`, so
      # no .ps1 suite is visible to it at all.
      #
      # HONEST SCOPE (preserved from the design, for when this is un-commented
      # on the public repo): the windows-latest leg of this job expands only
      # on `schedule` and carries continue-on-error, so the
      # two Windows steps below would be a SIGNAL, not a gate — the real gate
      # is the local run in the LUNA-131 build. The correlator step is
      # cross-platform and would run on every PR's ubuntu leg, making IT the
      # one real gate among the three. None of this fires here — the whole
      # block is inert YAML comments.
      #
      # The vault suites hard-SKIP without pre-commit (test-vault-git.ps1:16-21),
      # and a SKIP exits 0 — so without this install the Windows steps below
      # would be a permanent vacuous PASS (LUNA-131).
      # - name: Install pre-commit (Windows)
      #   if: runner.os == 'Windows'
      #   shell: bash
      #   run: python -m pip install --disable-pip-version-check pre-commit
      #
      # - name: Vault sweeper suite (Windows only)
      #   if: runner.os == 'Windows'
      #   shell: bash
      #   run: |
      #     set -o pipefail
      #     pwsh -NoProfile -File templates/luna-second-brain/scripts/test-vault-sweeper.ps1 | tee sweeper.log
      #     if grep -q '^SKIP all' sweeper.log; then
      #       echo "::error::vault-sweeper suite SKIPPED — a SKIP is not a pass"; exit 1
      #     fi
      #
      # - name: Foreground-window logger suite (Windows only)
      #   if: runner.os == 'Windows'
      #   shell: bash
      #   run: |
      #     set -o pipefail
      #     pwsh -NoProfile -File scripts/observability/test-foreground-window-log.ps1 | tee focus.log
      #     if grep -q '^SKIP all' focus.log; then
      #       echo "::error::foreground-window-log suite SKIPPED — a SKIP is not a pass"; exit 1
      #     fi
      #
      # - name: Focus/tick correlator suite
      #   run: node --test scripts/observability/focus-tick-correlate.test.mjs

  # Aggregating gate (HIMMEL-2872). Four things worth knowing before touching
  # this job:
  #
  # 1. The single-value `os` matrix below is deliberate and load-bearing: it
  #    is what makes the check-run context `shell-unit (ubuntu-latest)` rather
  #    than a bare `shell-unit`, keeping the required branch-protection
  #    context byte-for-byte identical to what it was before the work above
  #    was sharded. Sharding the work must not rename the gate.
  # 2. `needs.shell-unit-shard.result` is the matrix ROLLUP, `success` only
  #    when every leg that CAN fail the matrix succeeded. A job-level
  #    `continue-on-error` failure (the nightly windows leg) is NOT
  #    counted against that rollup, so those legs stay advisory exactly as
  #    they are today — this job never has to name any OS itself.
  # 3. `if: always()` plus the explicit `!= success` test below is the
  #    fail-CLOSED shape: `failure`, `cancelled` AND `skipped` all redden this
  #    job. A bare `needs:` without `always()` would SKIP this job whenever a
  #    shard failed — and a required check that never reports leaves the PR
  #    hanging rather than red.
  # 4. No setup: this job is a verdict, not work. It DOES check out (HIMMEL-3166)
  #    — the report steps below run a repo script, and without a checkout
  #    `bash scripts/ci/shell-extended-nightly-issue.sh` died with rc=127 on
  #    the 2026-09-18 nightly, so the alert never fired. A plain checkout
  #    rather than a sparse `scripts/ci` one: the script sources nothing today,
  #    but this leg only runs unwatched, so a future `source` of a sibling lib
  #    would re-break it silently. Same shape as bun-suites' windows-nightly
  #    steps.
  #
  # 5. issues:write (beyond the workflow-level contents:read) is needed only
  #    by the shell-extended-nightly-issue.sh steps below — scoped to this
  #    job alone, same pattern as bun-suites' windows-nightly-issue.sh.
  #    HIMMEL-3132: SUITE_TIER_DEFAULT `extended` suites only run under
  #    SUITE_TIER_MODE=all (the schedule leg, set above at
  #    shell-unit-shard), so a red extended suite only ever reddens THIS
  #    job on that leg — a run nobody watches interactively. Without these
  #    steps that failure is silent even though the job itself goes red.
  shell-unit:
    needs: shell-unit-shard
    if: always()
    # HIMMEL-3788: a manual dispatch on an arbitrary branch/PR head must not
    # post a check-run literally named "shell-unit (ubuntu-latest)" --
    # identical to (and newer than) the PR's own required check -- or GitHub's
    # required-check evaluation and check-ci.sh both read the dispatch run's
    # result and shadow the PR's. HIMMEL-3853 removed the all-OS dispatch input,
    # so a dispatch is now ubuntu-only; the distinct name is kept as the
    # name-collision guard.
    # schedule/pull_request/push keep the unchanged name.
    name: shell-unit${{ github.event_name == 'workflow_dispatch' && ' (dispatch verify)' || '' }} (${{ matrix.os }})
    permissions:
      contents: read
      issues: write
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Full history: impacted-selection.sh diffs base...HEAD and checks the
      # base is on origin/main, exactly as the shards did.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every gating shell-unit shard must have passed
        env:
          SHARDS_RESULT: ${{ needs.shell-unit-shard.result }}
        run: |
          echo "shell-unit-shard matrix rollup: $SHARDS_RESULT"
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error::shell-unit shards did not all pass (matrix rollup: $SHARDS_RESULT) — see the shell-unit-shard jobs on this run."
            exit 1
          fi
          echo "OK: every gating shell-unit shard passed."
      - name: Download shard manifests
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v7
        with:
          pattern: shell-unit-manifest-ubuntu-latest-shard*
          path: shard-manifest/
          merge-multiple: true
      # HIMMEL-3897: green shards are not enough once a PR's shards run only
      # the impacted suites. Recompute the selection here (same base-sourced
      # script, same base, same merge commit) and require every ubuntu shard's
      # manifest to carry it verbatim, and the shards together to have run each
      # selected suite exactly once and green. A missing manifest, one from
      # another sha, or a shard that ran less than selected is red. The
      # aggregator's own `--list .` is the discovery a shard's `notfound` is
      # checked against: a suite it lists to RUN that no shard ran is red, so a
      # shard cannot drop one by filtering it or claiming notfound. Its tier and
      # changed-since filters MUST match the shards' env above (the impacted
      # filter stays off: the selection is checked separately).
      - name: Every shard ran exactly the selection
        env:
          IMPACTED_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == github.event.repository.default_branch && github.event.pull_request.base.sha || '' }}
          SUITE_TIER_MODE: ${{ github.event_name == 'schedule' && 'all' || 'fast' }}
          SUITE_CHANGED_SINCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          bash scripts/ci/impacted-selection.sh "$IMPACTED_BASE" HEAD > shard-selection.txt
          head -n 2 shard-selection.txt
          bash scripts/ci/run-shell-tests.sh --list . > shard-discovered.txt
          bash scripts/ci/shard-manifest-verify.sh --dir shard-manifest --shards 8 --selection shard-selection.txt --discovered shard-discovered.txt
      # HIMMEL-3897 / HIMMEL-3896: the post-merge full sweep is where a
      # selector miss shows up — a suite red on main that the merged PR's
      # impacted selection did not list. Recorded, never blocking: the red
      # shards already fail this job; this names which reds a PR run would
      # have missed, for the selector's miss ledger.
      - name: Selector-miss ledger (main push, red sweep)
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RANGE: ${{ github.event.before }}..${{ github.sha }}
        run: |
          awk '$1 == "ran" && $2 != "0" { print $3 }' shard-manifest/manifest-shard*.txt 2>/dev/null | sort -u > shard-red-suites.txt
          echo "red suites on this sweep: $(wc -l < shard-red-suites.txt)"
          rc=0
          bash scripts/cr/impacted-suites.sh --selector-miss "$RANGE" --red-file shard-red-suites.txt > selector-miss.txt || rc=$?
          { echo "### Selector-miss ledger ($RANGE, rc $rc)"; echo '```'; cat selector-miss.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat selector-miss.txt
      - name: Upload selector-miss ledger
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: selector-miss-ledger
          path: |
            selector-miss.txt
            shard-red-suites.txt
          if-no-files-found: ignore
          retention-days: 90
      # Scoped to the schedule leg: that is the only leg where
      # SUITE_TIER_MODE=all actually exercises the extended tier (see
      # shell-unit-shard above), so only there does a red here plausibly mean
      # an extended suite broke rather than double-reporting a per-PR fast-
      # tier failure the PR gate already surfaced.
      - name: Extended-tier nightly issue — clear on green
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/shell-extended-nightly-issue.sh 0 "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Extended-tier nightly issue — file/refresh on red
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/shell-extended-nightly-issue.sh 1 "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
