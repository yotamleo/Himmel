name: Release

# HIMMEL-3059 slice 1: on a version tag, build the pre-built himmel tarball and
# publish it with its SHA256 as release assets. Tag-only -- never runs on a PR,
# so it adds nothing to PR CI time. The build + hash live in
# scripts/release/build-tarball.sh (tested by scripts/release/test-build-tarball.sh,
# which also asserts THIS file uploads both assets).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  tarball:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release if absent + upload assets
      id-token: write      # attest-build-provenance: mint the OIDC token
      attestations: write  # attest-build-provenance: publish the attestation
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build tarball + sha256
        run: |
          ver="${TAG#v}"
          bash scripts/release/build-tarball.sh --version "$ver" --out dist-release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist-release/himmel-*-linux.tar.gz

      - name: Ensure the release exists
        run: |
          # HIMMEL-3920: a bare --generate-notes on the first non-prerelease tag spans the
          # whole history and 422s (body > 125000 chars). Notes come from the curated
          # docs/release/<TAG>-notes.md at the tag when it exists, else generated notes
          # bounded to the previous tag in version order.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; skipping create"
            exit 0
          fi
          # The notes path is built from the tag only after it matches a strict version shape.
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "unexpected tag shape: $TAG" >&2; exit 1; }
          # A tag with a `-` (v0.3.0-pre.4) is a prerelease, matching the existing releases.
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          notes="docs/release/${TAG}-notes.md"
          if [ -s "$notes" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes" "${flags[@]}"
          else
            # Previous tag = the next one down in version order (prereleases sort below
            # their release via versionsort.suffix). The checkout is shallow, so fetch tags.
            git fetch --tags --force --quiet origin
            prev="$(git -c versionsort.suffix=- tag --list 'v*' --sort=-version:refname | awk -v t="$TAG" 'f && !p{print;p=1} $0==t{f=1}')"
            if [ -n "$prev" ]; then
              gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --notes-start-tag "$prev" "${flags[@]}"
            else
              # Very first tag: no predecessor, so the whole history IS the first release's range.
              gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
            fi
          fi

      - name: Upload both assets
        run: |
          ver="${TAG#v}"
          gh release upload "$TAG" --clobber \
            "dist-release/himmel-${ver}-linux.tar.gz" \
            "dist-release/himmel-${ver}-linux.tar.gz.sha256"

      # What an adopter does: download the PUBLISHED assets and verify with the
      # published hash. Fails the job if the uploaded pair does not verify.
      - name: Verify the published pair
        run: |
          ver="${TAG#v}"
          d="$(mktemp -d)"
          cd "$d"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "himmel-${ver}-linux.tar.gz" \
            --pattern "himmel-${ver}-linux.tar.gz.sha256"
          sha256sum -c "himmel-${ver}-linux.tar.gz.sha256"
          gh attestation verify "himmel-${ver}-linux.tar.gz" -R "$GITHUB_REPOSITORY"
