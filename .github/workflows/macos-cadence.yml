name: "CI (os:macos cadence)"

# HIMMEL-3902: macOS shell-unit lives HERE, not in ci.yml. Operator ruling
# 2026-09-30: fleet velocity beats macOS coverage breadth. While macOS legs sat
# in the nightly `CI` run, a macOS-only red turned that run -- and so main --
# red (the shell-unit aggregator's health step, HIMMEL-3699), and the red-main
# policy then pulled legs into macOS triage. Now a macOS red is a red of THIS
# workflow (`os:macos`), never of `CI`, and each run records which suites
# newly broke since the previous one (scripts/ci/macos-breakage.sh) so the
# trade-off is measurable: docs/internals/testing.md.
#
# Cadence: Tuesday + Friday 05:43 UTC -- twice a week, so a macOS regression is
# seen within ~3-4 days instead of the next morning, at ~2/7ths of the nightly's
# 10x-billed macOS runner cost (and off the nightly's 07:17 slot).
#
# The macOS legs run never on an unlabelled PR and never on push: that would put
# them back on every PR (HIMMEL-3853). A PR opts in with the `ci:macos` label
# (HIMMEL-7276): the run starts when the label is added and on each later push,
# and both jobs are skipped for any PR without it. A PR run never records
# breakages (the record belongs to main). Dispatch (needs this file on main):
#   gh workflow run macos-cadence.yml --ref main
#
# A fix PR proves only ITS suites. Dispatch with `suites` set (space-
# separated repo-relative test-*.sh paths) and ONE runner runs just those via
# run-shell-tests.sh --only-list, in minutes instead of the 8-shard hour-plus run:
#   gh workflow run macos-cadence.yml --ref <branch> -f suites="<path> <path>"
# The run-name carries the list, and ready-check.sh item 10 accepts the run when
# the log shows [PASS] for every named suite (however red the rest). Empty
# `suites` = the unchanged full cadence. A filtered run records no breakage
# metric: its partial suite set would read the unlisted suites as fixed.
run-name: "${{ inputs.suites != '' && format('macos-cadence suites: {0}', inputs.suites) || 'CI (os:macos cadence)' }}"
on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Space-separated repo-relative suite paths; set = run only these on one runner'
        required: false
        default: ''
        type: string
  pull_request:
    types: [labeled, synchronize]
  schedule:
    - cron: '43 5 * * 2,5'   # Tue + Fri, UTC

permissions:
  contents: read

# One cadence run per ref. cancel-in-progress is false so a dispatch never kills
# a running scheduled run (and with it a breakage record); a repeat just waits.
concurrency:
  group: macos-cadence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shell:
    name: macos-cadence / shell (${{ matrix.os }}, ${{ matrix.shard }})
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:macos') && (github.event.action != 'labeled' || github.event.label.name == 'ci:macos'))
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        # shard: same partition as ci.yml's shell-unit-shard. The `8` here, the
        # `/8` in the run step and `--shards-expected 8` in `summary` are three
        # spellings of one number and must agree (pinned by
        # test-macos-cadence-workflow.sh).
        # A `suites` dispatch needs one runner, not eight.
        shard: ${{ fromJSON(inputs.suites == '' && '[1, 2, 3, 4, 5, 6, 7, 8]' || '[1]') }}
    runs-on: ${{ matrix.os }}
    # No continue-on-error: a red macOS shard reddens THIS run and nothing else.
    # The cap only bounds a hung suite.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install obsidian-triage tool deps (marketplace suites)
        run: bash marketplace/plugins/obsidian-triage/tools/ensure-deps.sh
      - name: Install pre-commit (scripts/test-template-nostash-hooks.sh)
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/ci-image/requirements-ci.txt
      # The suites run `python3 -I` (no user site) and the runner's python3 is
      # Homebrew's, which refuses pip installs (externally-managed). A venv first
      # on PATH gives `python3` a PyYAML without touching the system interpreter.
      - name: PyYAML for python3 (the coderabbit-yaml-carveouts suite)
        run: |
          python3 -m venv "$RUNNER_TEMP/py3"
          "$RUNNER_TEMP/py3/bin/python" -m pip install --disable-pip-version-check --require-hashes -r .github/ci-image/requirements-ci.txt
          echo "$RUNNER_TEMP/py3/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/py3/bin/python" -I -c 'import yaml'
      # The write-fence hooks parse commands with shfmt and refuse without it, so
      # on a runner that lacks it every allow-row of those suites goes red. The
      # SAME release ci.yml puts on Linux (HIMMEL-6548), darwin_arm64 build,
      # sha256 from the release's own asset digest. Keep ver in lockstep with
      # ci.yml and .github/ci-image/Dockerfile.
      - name: Put pinned shfmt on PATH (bash-ast model rows)
        run: |
          ver=3.14.1
          sha=b7c872db63553ccffc7253aba3ed7d4885a27d83f1ba567b1138c6315a5847e5
          mkdir -p "$RUNNER_TEMP/shfmt-bin"
          curl -sSfL "https://github.com/mvdan/sh/releases/download/v${ver}/shfmt_v${ver}_darwin_arm64" -o "$RUNNER_TEMP/shfmt-bin/shfmt"
          echo "${sha}  $RUNNER_TEMP/shfmt-bin/shfmt" | shasum -a 256 -c -
          chmod 755 "$RUNNER_TEMP/shfmt-bin/shfmt"
          echo "$RUNNER_TEMP/shfmt-bin" >> "$GITHUB_PATH"
          echo "HIMMEL_REQUIRE_SHFMT=1" >> "$GITHUB_ENV"
      # SUITE_TIER_MODE=all: the whole corpus, extended tier included -- the
      # coverage the nightly's macOS legs had.
      # A `suites` dispatch: the input reaches the shell through SUITES (never
      # interpolated into the script), each word is checked to be a plain
      # repo-relative path, and --only-list runs just those suites.
      - id: tests
        run: |
          if [ -n "$SUITES" ]; then
            set -f
            printf '%s\n' $SUITES > macos-suites.txt
            if grep -qvE '^[A-Za-z0-9_./-]+$' macos-suites.txt || grep -q '\.\.' macos-suites.txt; then
              echo "::error::suites must be plain repo-relative paths"
              exit 2
            fi
            bash scripts/ci/run-shell-tests.sh --only-list macos-suites.txt .
          else
            bash scripts/ci/run-shell-tests.sh --shard ${{ matrix.shard }}/8 .
          fi
        env:
          FAIL_LOG_DIR: failed-suite-logs
          SUITE_TIER_MODE: all
          SUITES: ${{ inputs.suites }}
      # Even when the run step above went red: this is the per-shard input to
      # the breakage metric. Skipped when setup died before the tests ran, so
      # `summary` sees a missing report (infra_suspect), not an empty one.
      # A shard killed mid-run has no .run-complete sentinel in failed-suite-logs:
      # suites-from-logs then exits 3, no failed.txt is uploaded, and `summary`
      # flags the missing report as infra_suspect (HIMMEL-3906).
      - name: List failed suites (breakage metric input)
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          mkdir -p macos-failed
          rc=0
          bash scripts/ci/macos-breakage.sh suites-from-logs failed-suite-logs > macos-failed/failed.txt || rc=$?
          if [ "$rc" != 0 ]; then
            rm -f macos-failed/failed.txt
            echo "::warning::shard ${{ matrix.shard }}: suites-from-logs exited $rc (3 = no completion sentinel); no failed-suite report uploaded"
            [ "$rc" = 3 ] || exit "$rc"
          fi
      - name: Upload failed-suite list
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-failed-suites-shard${{ matrix.shard }}
          overwrite: true
          path: macos-failed/failed.txt
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload failed-suite logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-cadence-failed-logs-${{ matrix.os }}-shard${{ matrix.shard }}
          overwrite: true
          path: failed-suite-logs/
          if-no-files-found: ignore
          retention-days: 14

  # Verdict + breakage metric. actions:read is for `gh run download/list` of
  # this and earlier cadence runs; nothing here writes to the repo.
  summary:
    name: macos-cadence / summary
    needs: shell
    if: always() && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:macos') && (github.event.action != 'labeled' || github.event.label.name == 'ci:macos')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record breakages against the previous cadence run
        if: github.event_name != 'pull_request' && inputs.suites == ''
        # shell: bash = `bash -e -o pipefail`: without it the step's status is
        # tee's and a die inside `record` (rc 2) would go green.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          SHARDS_RESULT: ${{ needs.shell.result }}
        run: |
          mkdir -p failed-artifacts
          gh run download "$RUN_ID" -R "$REPO" -p 'macos-failed-suites-*' -D failed-artifacts || echo "no failed-suite artifacts on this run"
          prev=""
          rc=0
          bash scripts/ci/macos-breakage.sh prev-record --repo "$REPO" --run-id "$RUN_ID" --dest prev-record.json || rc=$?
          if [ "$rc" = 0 ]; then
            prev="--prev-file prev-record.json"
          elif [ "$rc" = 1 ]; then
            echo "no earlier recorded cadence run: this run is the baseline"
          else
            echo "previous-record lookup failed (rc=$rc): not treating this run as a baseline" >&2
            exit "$rc"
          fi
          # $prev is intentionally unquoted: it is empty or two words.
          # shellcheck disable=SC2086
          bash scripts/ci/macos-breakage.sh record --run-id "$RUN_ID" --head-sha "$HEAD_SHA" \
            --run-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --shards-result "$SHARDS_RESULT" \
            --shards-expected 8 --failed-dir failed-artifacts $prev \
            --out record.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload breakage record
        if: always() && github.event_name != 'pull_request' && inputs.suites == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-breakage-record
          overwrite: true
          path: record.json
          if-no-files-found: error
          retention-days: 90
      # HIMMEL-3699: the guard that a macOS job actually PASSED on this run
      # (missing entirely / all skipped is not health), reading the Jobs API.
      - name: macOS jobs must have passed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: bash scripts/ci/check-macos-nightly-health.sh
